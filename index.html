<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welsing Zeiten – v1.6.5 Kompakt + Monteur (stabil)</title>
<meta name="theme-color" content="#E2231A">
<style>
  :root{--bg:#0b0c10;--card:#15171c;--ink:#fff;--muted:#c7c7c9;--accent:#F28C00;--accent-ink:#1a1300;--primary:#E2231A;--line:#2a2e36;--focus:#FBB040}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:10px 14px;position:sticky;top:0;z-index:9;background:var(--primary);border-bottom:4px solid var(--focus);display:flex;justify-content:space-between;align-items:center}
  .ver{font-size:12px;background:#00000033;border:1px solid #ffffff33;padding:2px 6px;border-radius:8px}
  .wrap{padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:10px}
  .cols2{grid-template-columns:1fr 1fr}
  @media(max-width:720px){.cols2{grid-template-columns:1fr}}
  label{font-size:13px;color:var(--muted)}
  input,select,textarea,button{font-size:16px}
  input[type="text"],textarea,select{background:#0f1116;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;-webkit-text-fill-color:#fff;color:#fff;caret-color:var(--focus)}
  textarea{min-height:90px}
  table{border-collapse:collapse;width:100%;background:#0f1116;border-radius:10px;overflow:hidden;font-size:12px}
  th,td{border:1px solid var(--line);padding:6px;text-align:center}
  thead th{background:var(--focus);color:#000;font-weight:800}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;min-height:40px;font-size:13px}
  .btn.secondary{background:transparent;color:#fff;border:2px solid var(--accent)}
  .abs-btn{min-height:34px;padding:6px 8px;font-size:14px;font-weight:700;width:100%}
  .absence-legend{font-size:11px;line-height:1.2}
  .pill{display:inline-block;background:#0f1116;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}
  .registry-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .registry-actions select{max-width:220px}
  .footer{position:sticky;bottom:0;background:#0f1116;border-top:3px solid var(--primary);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;z-index:9}
  .footer>*{flex:1 1 48%}
  iframe#printFrame{position:fixed;left:-9999px;top:-9999px;width:0;height:0;border:0}
  .hcell input{-webkit-appearance:none;appearance:none;background:#0f1116!important;border:0;width:100%;text-align:center;font-size:16px;font-weight:600;color:#ffffff!important;-webkit-text-fill-color:#ffffff!important;caret-color:var(--focus)}
  .hcell input::placeholder{color:#666}
  .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hscroll table{min-width:640px}
  @media(max-width:720px){th,td{padding:4px}.btn{padding:8px 10px}.hscroll table{min-width:560px}}
</style>
</head>
<body>
<header>
  <b>Welsing Zeiten</b>
  <div class="ver">v1.6.5 Kompakt + Monteur</div>
</header>

<div class="wrap">
  <div class="card">
    <div class="grid cols2">
      <div><label>KW</label><input id="kw" type="text" placeholder="z. B. KW 42"></div>
      <div><label>Zeitraum</label><input id="zr" type="text" placeholder="z. B. 13.10.–18.10.2025"></div>
    </div>
    <div class="grid cols2">
      <div><label>Monteur-Team (Komma)</label><input id="team" type="text" placeholder="z. B. Kevin, Jacub, Mario"></div>
      <div><label>Sonntag</label><select id="sun"><option value="0">aus</option><option value="1">an</option></select></div>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn secondary" id="btnApplyTeam">Team übernehmen</button>
      <button class="btn" id="btnWeeklyAll">Wochenbericht (alle) PDF</button>
      <button class="btn secondary" id="btnPdfAllK">Alle Arbeitsberichte PDF</button>
      <select id="selMonteur" title="Monteur wählen"></select>
      <button class="btn secondary" id="btnWeeklyMonteur">PDF Monteur Woche</button>
      <button class="btn secondary" id="btnWipe">Daten löschen</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <button class="btn secondary" id="btnAddK">+ Kunde</button>
      <button class="btn secondary" id="btnRemK">− Kunde</button>
      <select id="sel"></select>
      <button class="btn" id="btnScroll">Zu Kunde</button>
    </div>
    <div id="kunden"></div>
  </div>

  <div class="card" id="overviewCard">
    <div class="row" style="justify-content:space-between;width:100%">
      <b>Wochenübersicht (Summe je Monteur & Tag)</b>
      <span style="color:#bbb">nur zur Kontrolle</span>
    </div>
    <div id="overview"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;width:100%">
      <b>Abwesenheiten (Urlaub/Feiertag/Krank)</b>
      <span class="pill absence-legend">Auswahl: — / U / F / K</span>
    </div>
    <div id="absence"></div>
  </div>
</div>

<div class="footer">
  <select id="sel2"></select>
  <button class="btn secondary" id="btnScroll2">Zu Kunde</button>
  <button class="btn" id="btnPdfArbeitsbericht">PDF Kunde</button>
</div>

<iframe id="printFrame"></iframe>

<script>
(function(){
  var KEY="wz_v165_compact_monteur";
  var st={kw:"",zr:"",tage:["Mo","Di","Mi","Do","Fr","Sa"],team:["Kevin","Jacub","Mario","Martin","Tomas"],k:[],abs:[],reg:[]};
  var lastSel=0, delegatesAttached=false;

  function escapeHtml(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function escapeAttr(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
  function pad2(n){return (n<10?"0":"")+n;}
  function formatDate(d){return pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"."+d.getFullYear();}
  function getIsoWeekInfo(date){
    var d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
    var day=(d.getDay()+6)%7;
    d.setDate(d.getDate()-day+3);
    var firstThursday=new Date(d.getFullYear(),0,4);
    var week=1+Math.round(((d-firstThursday)/86400000-3)/7);
    var year=d.getFullYear();
    var monday=new Date(date.getFullYear(),date.getMonth(),date.getDate());
    monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
    var sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
    var saturday=new Date(monday); saturday.setDate(monday.getDate()+5);
    return {week:week,year:year,monday:monday,saturday:saturday,sunday:sunday};
  }
  function normalizeText(value){return (value||"").toString().trim().toLowerCase();}
  function findRegistryIndex(name,address){
    var n=normalizeText(name);
    var a=normalizeText(address);
    for(var i=0;i<st.reg.length;i++){
      if(normalizeText(st.reg[i].n)===n && normalizeText(st.reg[i].a)===a) return i;
    }
    return -1;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
  function load(){try{var raw=localStorage.getItem(KEY); if(!raw) return; var o=JSON.parse(raw)||{}; if(o.kw)st.kw=o.kw; if(o.zr)st.zr=o.zr; if(Array.isArray(o.tage)&&o.tage.length)st.tage=o.tage; if(Array.isArray(o.team)&&o.team.length)st.team=o.team; if(Array.isArray(o.k)&&o.k.length)st.k=o.k; if(Array.isArray(o.abs))st.abs=o.abs; if(Array.isArray(o.reg))st.reg=o.reg;}catch(e){}}

  function newK(){return {n:"",a:"",az:"",ag:"",h:st.team.map(function(){return st.tage.map(function(){return ""})}),m:[{b:"",s:"",r:""}]};}
  function ensureAtLeastOneKunde(){if(!Array.isArray(st.k)||st.k.length===0){st.k=[newK()];}}
  function fixShapes(){
    ensureAtLeastOneKunde();
    if(!Array.isArray(st.reg)) st.reg=[];
    for(var i=0;i<st.k.length;i++){
      var c=st.k[i]; if(!Array.isArray(c.h)) c.h=[];
      while(c.h.length<st.team.length) c.h.push(st.tage.map(function(){return ""}));
      while(c.h.length>st.team.length) c.h.pop();
      for(var r=0;r<c.h.length;r++){
        if(!Array.isArray(c.h[r])) c.h[r]=[];
        while(c.h[r].length<st.tage.length) c.h[r].push("");
        while(c.h[r].length>st.tage.length) c.h[r].pop();
      }
      if(!Array.isArray(c.m)||c.m.length===0) c.m=[{b:"",s:"",r:""}];
    }
    if(!Array.isArray(st.abs)) st.abs=[];
    while(st.abs.length<st.team.length) st.abs.push(st.tage.map(function(){return "";}));
    while(st.abs.length>st.team.length) st.abs.pop();
    for(var a=0;a<st.abs.length;a++){
      if(!Array.isArray(st.abs[a])) st.abs[a]=[];
      while(st.abs[a].length<st.tage.length) st.abs[a].push("");
      while(st.abs[a].length>st.tage.length) st.abs[a].pop();
    }
  }

  function sanitizeDec(s){s=(s||"").toString().replace(/,/g,".").replace(/[^0-9.]/g,""); var p=s.indexOf("."); if(p>=0) s=s.slice(0,p+1)+s.slice(p+1).replace(/\./g,""); return s;}
  function setH(i,r,d,v){
    v=sanitizeDec(v);
    if(st.k[i]&&st.k[i].h&&st.k[i].h[r]){st.k[i].h[r][d]=v; save(); updateRowSum(i,r); renderOverview();}
  }
  function setF(i,f,v){if(st.k[i]){st.k[i][f]=v; save(); renderOverview();}}
  function addM(i){if(st.k[i]){st.k[i].m.push({b:"",s:"",r:""}); save(); render();}}
  function delM(i,m){if(st.k[i]&&st.k[i].m&&st.k[i].m[m]!=null){st.k[i].m.splice(m,1); if(st.k[i].m.length===0) st.k[i].m.push({b:"",s:"",r:""}); save(); render();}}
  function setM(i,m,f,v){if(st.k[i]&&st.k[i].m&&st.k[i].m[m]){st.k[i].m[m][f]=v; save();}}
  function setAbsence(r,d,v){
    if(st.abs[r]){st.abs[r][d]=v; save();}
  }
  function saveToRegistry(i){
    if(!st.k[i]) return;
    var name=(st.k[i].n||"").trim();
    var address=(st.k[i].a||"").trim();
    if(!name) return;
    var idx=findRegistryIndex(name,address);
    if(idx>=0){
      st.reg[idx]={n:name,a:address};
    }else{
      st.reg.push({n:name,a:address});
    }
    save();
    render();
  }
  function applyFromRegistry(i){
    var sel=document.getElementById("regsel"+i);
    if(!sel) return;
    var idx=parseInt(sel.value,10);
    if(isNaN(idx) || !st.reg[idx]) return;
    st.k[i].n=st.reg[idx].n;
    st.k[i].a=st.reg[idx].a;
    save();
    render();
  }
  function addKunde(){st.k.push(newK()); save(); render(); setSel(st.k.length-1);}
  function remKunde(){if(st.k.length<=1){alert("Mindestens 1 Kunde.");return} st.k.splice(lastSel,1); if(lastSel>=st.k.length) lastSel=st.k.length-1; save(); render(); setSel(lastSel);}
  function setSel(v){lastSel=parseInt(v||"0",10)||0; var s1=document.getElementById("sel"), s2=document.getElementById("sel2"); if(s1) s1.value=String(lastSel); if(s2) s2.value=String(lastSel);}
  function scrollSel(){var el=document.getElementById("k"+lastSel); if(el) el.scrollIntoView({behavior:"smooth"});}
  function toggleSun(v){if(v==="1"){if(st.tage.indexOf("So")<0) st.tage.push("So");}else{st.tage=st.tage.filter(function(t){return t!=="So"});} fixShapes(); save(); render();}
  function applyTeam(){var raw=document.getElementById("team").value; var arr=raw.split(",").map(function(s){return s.trim()}).filter(Boolean); if(arr.length){st.team=arr; fixShapes(); save(); render();}}

  function updateRowSum(i,r){
    var card=document.getElementById("k"+i); if(!card) return;
    var tr=card.querySelector('tr[data-r="'+r+'"]'); if(!tr) return;
    var sum=0; tr.querySelectorAll("td.hcell input").forEach(function(inp){var v=(inp.value||"").replace(/,/g,"."); var n=parseFloat(v); if(!isNaN(n)) sum+=n;});
    var cell=tr.querySelector("td.sum-cell"); if(cell) cell.innerHTML="<b>"+sum.toFixed(2)+"</b>";
  }

  function renderOverview(){
    var grid=st.team.map(function(){return st.tage.map(function(){return 0;});});
    for(var k=0;k<st.k.length;k++){
      var c=st.k[k];
      for(var r=0;r<st.team.length;r++){
        for(var d=0;d<st.tage.length;d++){
          var v=parseFloat(c.h[r] ? (c.h[r][d]||0) : 0)||0;
          grid[r][d]+=v;
        }
      }
    }
    var head=st.tage.map(function(t){return "<th>"+t+"</th>"}).join("");
    var rows="";
    for(var r=0;r<st.team.length;r++){
      var w=0,cells="";
      for(var d=0;d<st.tage.length;d++){w+=grid[r][d]; cells+="<td>"+grid[r][d].toFixed(2)+"</td>";}
      rows+="<tr><th style='text-align:left'>"+escapeHtml(st.team[r])+"</th>"+cells+"<td><b>"+w.toFixed(2)+"</b></td></tr>";
    }
    document.getElementById("overview").innerHTML="<div class='hscroll'><table><thead><tr><th>Monteur</th>"+head+"<th>Woche gesamt</th></tr></thead><tbody>"+rows+"</tbody></table></div>";
  }

  function renderAbsence(){
    var head=st.tage.map(function(t){return "<th>"+t+"</th>"}).join("");
    var rows="";
    for(var r=0;r<st.team.length;r++){
      rows+="<tr><th style='text-align:left'>"+escapeHtml(st.team[r])+"</th>";
      for(var d=0;d<st.tage.length;d++){
        var v=(st.abs[r] && st.abs[r][d]) || "";
        rows+="<td><select class='abs-btn' data-action='setAbs' data-r='"+r+"' data-d='"+d+"'>"+
          "<option value=''"+(v===""?" selected":"")+">—</option>"+
          "<option value='U'"+(v==="U"?" selected":"")+">U</option>"+
          "<option value='F'"+(v==="F"?" selected":"")+">F</option>"+
          "<option value='K'"+(v==="K"?" selected":"")+">K</option>"+
          "</select></td>";
      }
      rows+="</tr>";
    }
    document.getElementById("absence").innerHTML="<div class='hscroll'><table><thead><tr><th>Monteur</th>"+head+"</tr></thead><tbody>"+rows+"</tbody></table></div>";
  }

  function kundenCard(i){
    var c=st.k[i], rows="";
    for(var r=0;r<st.team.length;r++){
      rows+="<tr data-r='"+r+"'><th style='text-align:left'>"+escapeHtml(st.team[r])+"</th>";
      for(var d=0;d<st.tage.length;d++){
        var v=(c.h[r] && c.h[r][d])||"";
        rows+="<td class='hcell'><input type='tel' inputmode='decimal' placeholder='0' value='"+escapeAttr(v)+"' data-i='"+i+"' data-r='"+r+"' data-d='"+d+"'></td>";
      }
      rows+="<td class='sum-cell'><b>0.00</b></td></tr>";
    }
    var regOptions="<option value=''>Kunde wählen…</option>";
    for(var ri=0;ri<st.reg.length;ri++){
      var regName=st.reg[ri].n||"";
      var regAddr=st.reg[ri].a||"";
      var regLabel=regName+(regAddr?" — "+regAddr:"");
      regOptions+="<option value='"+ri+"'>"+escapeHtml(regLabel)+"</option>";
    }
    var mats="";
    for(var m=0;m<c.m.length;m++){
      var it=c.m[m];
      mats+="<tr><td><input type='text' value='"+escapeAttr(it.b)+"' data-i='"+i+"' data-m='"+m+"' data-f='b'></td>"+
            "<td><input type='text' value='"+escapeAttr(it.s)+"' data-i='"+i+"' data-m='"+m+"' data-f='s'></td>"+
            "<td><input type='text' value='"+escapeAttr(it.r)+"' data-i='"+i+"' data-m='"+m+"' data-f='r'></td>"+
            "<td><button class='btn secondary' data-action='delM' data-i='"+i+"' data-m='"+m+"'>−</button></td></tr>";
    }
    if(!mats) mats="<tr><td colspan='4' style='text-align:center;color:#666'>—</td></tr>";
    return "<div class='card' id='k"+i+"'>"+
      "<div class='row'><span class='pill'>Kunde "+String(i+1).padStart(2,"0")+"</span>"+
      "<div class='registry-actions'>"+
        "<select id='regsel"+i+"' data-i='"+i+"'>"+regOptions+"</select>"+
        "<button class='btn secondary' data-action='applyReg' data-i='"+i+"'>Übernehmen</button>"+
        "<button class='btn secondary' data-action='saveReg' data-i='"+i+"'>Im Register speichern</button>"+
      "</div>"+
      "<button class='btn' data-action='printK' data-i='"+i+"'>PDF Arbeitsbericht</button></div>"+
      "<div class='grid cols2' style='margin-top:6px'>"+
        "<div><label>Name</label><input type='text' value='"+escapeAttr(c.n)+"' data-action='setF' data-i='"+i+"' data-f='n'></div>"+
        "<div><label>Adresse</label><input type='text' value='"+escapeAttr(c.a)+"' data-action='setF' data-i='"+i+"' data-f='a'></div>"+
      "</div>"+
      "<div class='grid cols2' style='margin-top:6px'>"+
        "<div><label>Auszuführende Arbeit</label><textarea data-action='setF' data-i='"+i+"' data-f='az'>"+escapeHtml(c.az)+"</textarea></div>"+
        "<div><label>Ausgeführte Arbeit</label><textarea data-action='setF' data-i='"+i+"' data-f='ag'>"+escapeHtml(c.ag)+"</textarea></div>"+
      "</div>"+
      "<div style='margin-top:8px'><b>Stunden</b><div class='hscroll'>"+
        "<table><thead><tr><th>Monteur</th>"+st.tage.map(function(t){return "<th>"+t+"</th>"}).join("")+"<th>Woche gesamt</th></tr></thead><tbody>"+rows+"</tbody></table>"+
      "</div></div>"+
      "<div style='margin-top:8px'><b>Materialverbrauch</b> <button class='btn secondary' data-action='addM' data-i='"+i+"'>+ Material</button>"+
        "<div class='hscroll'><table style='margin-top:6px'><thead><tr><th>Material</th><th>Stückzahl</th><th>Bemerkung</th><th></th></tr></thead><tbody>"+mats+"</tbody></table></div>"+
      "</div></div>";
  }

  function render(){
    fixShapes();
    if(!st.kw || !st.zr){
      var info=getIsoWeekInfo(new Date());
      if(!st.kw) st.kw="KW "+info.week;
      if(!st.zr){
        var endDate=st.tage.indexOf("So")>=0 ? info.sunday : info.saturday;
        st.zr=formatDate(info.monday)+"–"+formatDate(endDate);
      }
      save();
    }
    document.getElementById("kw").value=st.kw;
    document.getElementById("zr").value=st.zr;
    document.getElementById("sun").value=st.tage.indexOf("So")>=0?"1":"0";
    document.getElementById("team").value=st.team.join(", ");

    document.getElementById("selMonteur").innerHTML=st.team.map(function(n,i){return "<option value='"+i+"'>"+escapeHtml(n)+"</option>"}).join("");

    var opts=""; for(var i=0;i<st.k.length;i++){opts+="<option value='"+i+"'>"+String(i+1).padStart(2,"0")+" — "+escapeHtml(st.k[i].n||"Kunde")+"</option>";}
    if(!opts){st.k=[newK()]; opts="<option value='0'>01 — Kunde</option>";}
    document.getElementById("sel").innerHTML=opts; document.getElementById("sel2").innerHTML=opts;

    var html=""; for(var j=0;j<st.k.length;j++){html+=kundenCard(j);} document.getElementById("kunden").innerHTML=html;

    renderOverview();
    renderAbsence();
    setSel(lastSel);
    attachDelegatesOnce();

    setTimeout(function(){
      document.querySelectorAll("#kunden tr[data-r]").forEach(function(tr){
        var i = parseInt(tr.closest(".card").id.replace("k",""),10);
        var r = parseInt(tr.getAttribute("data-r"),10);
        updateRowSum(i,r);
      });
    },0);
  }

  function attachDelegatesOnce(){
    if(delegatesAttached) return; delegatesAttached=true;

    document.getElementById("kw").addEventListener("input",function(){st.kw=this.value;save();});
    document.getElementById("zr").addEventListener("input",function(){st.zr=this.value;save();});
    document.getElementById("sun").addEventListener("change",function(){toggleSun(this.value);});
    document.getElementById("btnApplyTeam").addEventListener("click",applyTeam);

    document.getElementById("btnWeeklyAll").addEventListener("click",printWeeklyAll);
    document.getElementById("btnPdfAllK").addEventListener("click",printAllArbeitsberichte);
    document.getElementById("btnWeeklyMonteur").addEventListener("click",function(){var r=parseInt(document.getElementById("selMonteur").value||"0",10)||0; printMonteurWeekly(r);});
    document.getElementById("btnWipe").addEventListener("click",function(){if(confirm("Alle gespeicherten Daten löschen?")){try{localStorage.removeItem(KEY);}catch(e){} location.reload();}});

    document.getElementById("btnAddK").addEventListener("click",addKunde);
    document.getElementById("btnRemK").addEventListener("click",remKunde);
    document.getElementById("sel").addEventListener("change",function(){setSel(this.value);});
    document.getElementById("btnScroll").addEventListener("click",scrollSel);

    document.getElementById("sel2").addEventListener("change",function(){setSel(this.value);});
    document.getElementById("btnScroll2").addEventListener("click",scrollSel);
    document.getElementById("btnPdfArbeitsbericht").addEventListener("click",function(){printK(lastSel);});

    var kc=document.getElementById("kunden");
    kc.addEventListener("input",function(e){
      var t=e.target;
      if(t.matches("td.hcell input")){setH(+t.dataset.i,+t.dataset.r,+t.dataset.d,t.value);return;}
      if(t.matches("[data-action='setF']")){setF(+t.dataset.i,t.dataset.f,t.value);return;}
      if(t.dataset.f && t.dataset.m!==undefined){setM(+t.dataset.i,+t.dataset.m,t.dataset.f,t.value);return;}
    });
    kc.addEventListener("click",function(e){
      var b=e.target.closest("button[data-action]"); if(!b) return;
      var act=b.dataset.action, i=+b.dataset.i;
      if(act==="addM") addM(i);
      else if(act==="delM") delM(i,+b.dataset.m);
      else if(act==="printK") printK(i);
      else if(act==="saveReg") saveToRegistry(i);
      else if(act==="applyReg") applyFromRegistry(i);
    });

    var ab=document.getElementById("absence");
    ab.addEventListener("change",function(e){
      var sel=e.target.closest("select[data-action='setAbs']"); if(!sel) return;
      setAbsence(+sel.dataset.r,+sel.dataset.d,sel.value);
    });
  }

  function writePrint(html){var fr=document.getElementById("printFrame"); var win=fr.contentWindow||fr; var doc=win.document; doc.open(); doc.write(html); doc.close();}

      "<style>body{font:12px/1.4 system-ui,Segoe UI,Roboto,Arial;padding:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #777;padding:5px;text-align:center}.meta td{border:none;text-align:left;padding:2px 0}.signature{height:50px;border-top:1px solid #777;margin-top:20px}@page{size:A4;margin:14mm}</style></head><body>"+
      pdfHeader("Arbeitsbericht")+
      "<div><b>KW:</b> "+escapeHtml(st.kw)+" &nbsp; <b>Zeitraum:</b> "+escapeHtml(st.zr)+"</div>"+
      "<table class='meta'><tr><td><b>Kunde:</b> "+escapeHtml(c.n||"")+"</td></tr><tr><td><b>Adresse:</b> "+escapeHtml(c.a||"")+"</td></tr></table>"+
      "<h3>Auszuführende Arbeit</h3><div>"+escapeHtml(c.az||"").replace(/\n/g,"<br>")+"</div>"+

      "<script>onload=function(){print()}<\/script></body></html>";
      //           ^^^^^^^^^^^^^^^^^^^^^^^  WICHTIG: escapen!

    writePrint(html);
  }

      var rows="";
      for(var r=0;r<st.team.length;r++){
        var sum=0,cells="";

  // --- PDF Woche (alle Kunden) ---
  function printWeeklyAll(){
    var grid=st.team.map(function(){return st.tage.map(function(){return 0;});});
    var lines=[];
    for(var k=0;k<st.k.length;k++){
      var c=st.k[k];
      for(var r=0;r<st.team.length;r++){
        for(var d=0;d<st.tage.length;d++){
          var h=parseFloat(c.h[r]?(c.h[r][d]||0):0)||0;
          grid[r][d]+=h;
          if(h>0){lines.push({tag:st.tage[d], kunde:c.n||"", monteur:st.team[r], stunden:h});}
        }
      }
    }
    var head=st.tage.map(function(t){return "<th>"+t+"</th>"}).join("");
    var rows="";
    for(var r=0;r<st.team.length;r++){
      var w=0,cells="";
      for(var d=0;d<st.tage.length;d++){w+=grid[r][d]; cells+="<td>"+grid[r][d].toFixed(2)+"</td>";}
      rows+="<tr><th style='text-align:left'>"+escapeHtml(st.team[r])+"</th>"+cells+"<td><b>"+w.toFixed(2)+"</b></td></tr>";
    }
    var lrows=lines.map(function(x){return "<tr><td>"+x.tag+"</td><td>"+escapeHtml(x.kunde)+"</td><td>"+escapeHtml(x.monteur)+"</td><td>"+x.stunden.toFixed(2)+"</td></tr>";}).join("");
    if(!lrows) lrows="<tr><td colspan='4' style='text-align:center;color:#666'>—</td></tr>";

    var absRows="";
    for(var ar=0;ar<st.team.length;ar++){
      absRows+="<tr><th style='text-align:left'>"+escapeHtml(st.team[ar])+"</th>";
      for(var ad=0;ad<st.tage.length;ad++){
        var av=(st.abs[ar] && st.abs[ar][ad]) || "—";
        absRows+="<td>"+av+"</td>";
      }
      absRows+="</tr>";
    }
    var absHead=st.tage.map(function(t){return "<th>"+t+"</th>"}).join("");

    var html="<!doctype html><html><head><meta charset='utf-8'><title>Wochenbericht</title>"+
      "<style>body{font:12px/1.4 system-ui,Segoe UI,Roboto,Arial;padding:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #777;padding:5px;text-align:center}@page{size:A4;margin:14mm}</style></head><body>"+
      pdfHeader("Wochenbericht (alle Kunden)")+
      "<div><b>KW:</b> "+escapeHtml(st.kw)+" &nbsp; <b>Zeitraum:</b> "+escapeHtml(st.zr)+"</div>"+
      "<h3>Summen je Monteur / Tag</h3><table><thead><tr><th>Monteur</th>"+head+"<th>Woche gesamt</th></tr></thead><tbody>"+rows+"</tbody></table>"+
      "<h3 style='margin-top:14px'>Abwesenheiten (U/F/K)</h3><table><thead><tr><th>Monteur</th>"+absHead+"</tr></thead><tbody>"+absRows+"</tbody></table>"+
      "<h3 style='margin-top:14px'>Detail (Tag / Kunde / Monteur)</h3><table><thead><tr><th>Tag</th><th>Kunde</th><th>Monteur</th><th>Stunden</th></tr></thead><tbody>"+lrows+"</tbody></table>"+
      "<script>onload=function(){print()}<\/script></body></html>";
      //           ^^^^^^^^^^^^^^^^^^^^^^^  WICHTIG

    writePrint(html);
  }

  // --- PDF Wochenbericht Monteur ---
  function printMonteurWeekly(r){
    var name=st.team[r]||("Monteur "+(r+1));
    var head=st.tage.map(function(t){return "<th>"+t+"</th>"}).join("");
    var cells="", wsum=0, lines=[];
    for(var d=0;d<st.tage.length;d++){
      var s=0;
      for(var k=0;k<st.k.length;k++){
        var c=st.k[k];
        var h=parseFloat(c.h[r]?(c.h[r][d]||0):0)||0;
        s+=h;
        if(h>0) lines.push({tag:st.tage[d], kunde:c.n||"", stunden:h});
      }
      wsum+=s;
      cells+="<td>"+s.toFixed(2)+"</td>";
    }
    var row="<tr><th style='text-align:left'>"+escapeHtml(name)+"</th>"+cells+"<td><b>"+wsum.toFixed(2)+"</b></td></tr>";
    var lrows=lines.map(function(x){return "<tr><td>"+x.tag+"</td><td>"+escapeHtml(x.kunde)+"</td><td>"+x.stunden.toFixed(2)+"</td></tr>";}).join("");
    if(!lrows) lrows="<tr><td colspan='3' style='text-align:center;color:#666'>—</td></tr>";

    var absCells="";
    for(var ad=0;ad<st.tage.length;ad++){
      var av=(st.abs[r] && st.abs[r][ad]) || "—";
      absCells+="<td>"+av+"</td>";
    }
    var absRow="<tr><th style='text-align:left'>"+escapeHtml(name)+"</th>"+absCells+"</tr>";

    var html="<!doctype html><html><head><meta charset='utf-8'><title>Wochenbericht Monteur</title>"+
      "<style>body{font:12px/1.4 system-ui,Segoe UI,Roboto,Arial;padding:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #777;padding:5px;text-align:center}@page{size:A4;margin:14mm}</style></head><body>"+
      pdfHeader("Wochenbericht (Monteur) — "+escapeHtml(name))+
      "<div><b>KW:</b> "+escapeHtml(st.kw)+" &nbsp; <b>Zeitraum:</b> "+escapeHtml(st.zr)+"</div>"+
      "<h3>Summen je Tag</h3><table><thead><tr><th>Monteur</th>"+head+"<th>Woche gesamt</th></tr></thead><tbody>"+row+"</tbody></table>"+
      "<h3 style='margin-top:14px'>Abwesenheiten (U/F/K)</h3><table><thead><tr><th>Monteur</th>"+head+"</tr></thead><tbody>"+absRow+"</tbody></table>"+
      "<h3 style='margin-top:14px'>Detail (Tag / Kunde)</h3><table><thead><tr><th>Tag</th><th>Kunde</th><th>Stunden</th></tr></thead><tbody>"+lrows+"</tbody></table>"+
      "<script>onload=function(){print()}<\/script></body></html>";
      //           ^^^^^^^^^^^^^^^^^^^^^^^  WICHTIG

    writePrint(html);
  }

  load(); ensureAtLeastOneKunde(); fixShapes(); render();
})();
