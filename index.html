<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welsing Zeiten – v1.6.5 stabil</title>

<style>
:root{
  --bg:#0b0c10;--card:#15171c;--ink:#fff;--muted:#bbb;
  --accent:#F28C00;--primary:#E2231A;--line:#2a2e36
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}
header{background:var(--primary);padding:10px;display:flex;justify-content:space-between}
.wrap{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap}
label{font-size:12px;color:var(--muted)}
input,select,textarea,button{font-size:15px}
input,select,textarea{width:100%;background:#0f1116;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:70px}
button{background:var(--accent);border:0;border-radius:8px;padding:8px 10px;font-weight:700}
button.secondary{background:transparent;color:#fff;border:2px solid var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:4px;text-align:center}
thead th{background:#fbb040;color:#000}
.hscroll{overflow-x:auto}
.hscroll table{min-width:560px}
.footer{position:sticky;bottom:0;background:#0f1116;padding:8px;display:flex;gap:6px}
iframe{display:none}

.hcell input{
  text-align:center;font-weight:600;font-size:15px;
  background:#0f1116;color:#fff;border:0
}
</style>
</head>

<body>
<header>
  <b>Welsing Zeiten</b>
  <span>v1.6.5 stabil</span>
</header>

<div class="wrap">

<div class="card">
  <div class="row">
    <div style="flex:1">
      <label>KW</label>
      <input id="kw">
    </div>
    <div style="flex:1">
      <label>Zeitraum</label>
      <input id="zr">
    </div>
  </div>

  <div class="row">
    <div style="flex:2">
      <label>Monteur (Komma)</label>
      <input id="team">
    </div>
    <div style="flex:1">
      <label>Datum automatisch</label>
      <button class="secondary" id="btnDate">Heute</button>
    </div>
  </div>

  <div class="row">
    <button id="btnApply">Team übernehmen</button>
    <button id="btnWeek">PDF Woche</button>
    <select id="selMonteur"></select>
    <button class="secondary" id="btnMonteur">PDF Monteur</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <button class="secondary" id="addK">+ Kunde</button>
    <button class="secondary" id="remK">− Kunde</button>
    <select id="selK"></select>
  </div>
  <div id="kunden"></div>
</div>

</div>

<div class="footer">
  <button id="pdfKunde">PDF Kunde</button>
</div>

<iframe id="print"></iframe>

<script>
(function(){
const KEY="wz_v165_final";

let st={
  kw:"",zr:"",
  tage:["Mo","Di","Mi","Do","Fr","Sa"],
  team:["Kevin","Mario"],
  k:[]
};

function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function load(){
  let r=localStorage.getItem(KEY);
  if(r) st=JSON.parse(r)
}

function newK(){
  return {
    n:"",a:"",az:"",ag:"",
    h:st.team.map(()=>st.tage.map(()=>"" ))
  }
}

function ensure(){
  if(!st.k.length) st.k=[newK()]
}

function render(){
  ensure();
  kw.value=st.kw; zr.value=st.zr; team.value=st.team.join(", ");

  selMonteur.innerHTML=st.team.map((n,i)=>`<option value="${i}">${n}</option>`).join("");
  selK.innerHTML=st.k.map((_,i)=>`<option value="${i}">Kunde ${i+1}</option>`).join("");

  kunden.innerHTML=st.k.map((c,i)=>card(c,i)).join("");
  save();
}

function card(c,i){
  let rows="";
  st.team.forEach((n,r)=>{
    rows+=`<tr><th>${n}</th>`+
      st.tage.map((_,d)=>{
        return `<td class="hcell">
          <input data-i="${i}" data-r="${r}" data-d="${d}" value="${c.h[r][d]}">
        </td>`
      }).join("")+
      `</tr>`;
  });

  return `
  <div class="card">
    <label>Name</label><input data-f="n" data-i="${i}" value="${c.n}">
    <label>Adresse</label><input data-f="a" data-i="${i}" value="${c.a}">
    <div class="hscroll">
      <table>
        <thead><tr><th>Monteur</th>${st.tage.map(t=>`<th>${t}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

document.addEventListener("input",e=>{
  let t=e.target;
  if(t.dataset.f){
    st.k[t.dataset.i][t.dataset.f]=t.value;
  }
  if(t.dataset.d!==undefined){
    let v=t.value.toUpperCase();
    if(["U","URLAUB","K","KRANK","F","FEIERTAG"].includes(v)){
      st.k[t.dataset.i].h[t.dataset.r][t.dataset.d]=v;
    }else{
      st.k[t.dataset.i].h[t.dataset.r][t.dataset.d]=v.replace(/[^0-9.,]/g,"");
    }
  }
  save();
});

btnApply.onclick=()=>{
  st.team=team.value.split(",").map(s=>s.trim()).filter(Boolean);
  st.k.forEach(k=>{
    k.h=st.team.map(()=>st.tage.map(()=>"" ))
  });
  render();
};

addK.onclick=()=>{st.k.push(newK());render()};
remK.onclick=()=>{if(st.k.length>1){st.k.pop();render()}};

btnDate.onclick=()=>{
  let d=new Date();
  zr.value=d.toLocaleDateString("de-DE");
  st.zr=zr.value; save();
};

kw.oninput=()=>{st.kw=kw.value;save()};
zr.oninput=()=>{st.zr=zr.value;save()};

function printHTML(html){
  let f=print.contentWindow.document;
  f.open();f.write(html);f.close();
}

pdfKunde.onclick=()=>{
  let c=st.k[selK.value];
  let html=`<h2>Arbeitsbericht</h2><b>${c.n}</b><br>KW ${st.kw}<pre>${JSON.stringify(c.h,null,2)}</pre><script>print()</script>`;
  printHTML(html);
};

btnWeek.onclick=()=>{
  let html=`<h2>Wochenbericht</h2>KW ${st.kw}<script>print()</script>`;
  printHTML(html);
};

btnMonteur.onclick=()=>{
  let m=selMonteur.value;
  let html=`<h2>Monteur ${st.team[m]}</h2><script>print()</script>`;
  printHTML(html);
};

load(); render();
})();
</script>
</body>
</html>
